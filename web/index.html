<title>ИИ-Офис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-bleed isometric diorama (office tower on an island), white cards float at the edges */
:root{
  --bg:#dfe5db; --panel:#ffffff; --ink:#15171c; --muted:#646b76; --line:#eceef1; --chip:#f3f4f6;
  --btn:#121418; --btn-ink:#ffffff; --warm:#fff4e3; --warm-line:#fadcae;
  --ok:#22a55b; --wait:#f0a020; --err:#e5484d; --rest:#a3a9b3; --done:#3b82f6;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.07);
  --font:'Onest',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body[data-dark="1"]{
  --bg:#0e1216; --panel:#181c22; --ink:#eef0f3; --muted:#a0a7b2; --line:#262b33; --chip:#232831;
  --btn:#eef0f3; --btn-ink:#121418; --warm:#2a2216; --warm-line:#4a3a1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;font-size:13px;transition:background .5s}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.card{position:absolute;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.s-working{background:var(--ok)}.s-waiting{background:var(--wait)}.s-done{background:var(--done)}.s-resting{background:var(--rest)}.s-error{background:var(--err)}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:6px 11px;font-weight:600;font-size:12px;min-height:30px;white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--ink)}
.cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px}
.badge{font-size:11px;font-weight:700;background:var(--chip);color:var(--ink);padding:1px 7px;border-radius:99px;letter-spacing:0}
.badge.warn{background:#fde7c2;color:#8a4b00}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.chev{width:22px;height:22px;border:0;background:transparent;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.chev:hover{background:var(--chip)}
.ava{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;position:relative}
.ava i{width:11px;height:4px;border-radius:3px;background:rgba(0,0,0,.55);box-shadow:0 0 0 0 transparent}
.ava.tri{background:none!important}
.ava.tri::before{content:"";position:absolute;inset:0;background:var(--c);clip-path:polygon(50% 4%,96% 92%,4% 92%);border-radius:4px}
.ava.tri i{position:relative;top:3px}

/* brand */
.brand{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:14px;display:block;line-height:1.1}
.brand small{font-size:11px}
.brand .live{display:flex;align-items:center;gap:5px;font-size:11px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line);align-self:stretch}
.brand .live .dot{background:#6366f1}

/* left column */
.left{top:calc(env(safe-area-inset-top,0px) + 66px);left:max(12px,env(safe-area-inset-left,0px));width:248px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 66px - 210px);overflow:auto;background:none;box-shadow:none;border:0;padding:0 4px 4px 0}
.left .card{position:static}
.floors{padding:0 6px 6px}
.fl{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left;min-height:38px}
.fl:hover{background:var(--chip)}
.fl[aria-current="true"]{background:var(--chip)}
.fl .n{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--chip);color:var(--ink);flex-shrink:0;font-variant-numeric:tabular-nums}
.fl[aria-current="true"] .n{color:#fff}
.fl .nm{font-weight:600;font-size:13px;line-height:1.1}
.fl .dots{display:flex;gap:3px;margin-top:3px}.fl .dots .dot{width:5px;height:5px}
.fl .c{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wait{margin:0 8px 8px;padding:10px;border-radius:10px;background:var(--warm);border:1px solid var(--warm-line);display:flex;gap:10px;align-items:flex-start}
.wait .tx{flex:1;min-width:0}
.wait .nm{font-weight:700;font-size:13px}
.wait .ds{font-size:12px;line-height:1.35;margin-top:2px}
.wait .acts{display:flex;flex-direction:column;gap:4px}
.fin{display:flex;gap:9px;padding:6px 14px;align-items:flex-start}
.fin .ava{width:20px;height:20px;border-radius:6px}
.fin .nm{font-weight:600}
.fin .ds{font-size:12px}
.fin time{margin-left:auto;font-size:11px;color:var(--muted)}

/* top center */
.counts{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;white-space:nowrap}
.counts span{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-size:13px}
.counts b{font-variant-numeric:tabular-nums;font-size:14px}
.counts .hl{background:#fdecc8;color:#7a4300}
body[data-dark="1"] .counts .hl{background:#3d2e14;color:#ffd38a}

/* top right */
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;background:none;border:0;box-shadow:none}
.tr .btn{min-height:34px;padding:0 12px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.tr .btn.ghost{background:var(--panel);border:1px solid var(--line)}

/* right card */
.right{top:calc(env(safe-area-inset-top,0px) + 58px);right:max(12px,env(safe-area-inset-right,0px));width:292px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100% - 58px - 330px)}
.rh{padding:12px 14px 14px;color:#fff;display:flex;justify-content:space-between;transition:background .4s}
.rh .nm{font-weight:700;font-size:15px}
.rh .big{font-size:34px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.rh .big small{font-size:13px;font-weight:500;opacity:.9;margin-left:2px}
.rh .meta{font-size:11px;text-align:right;line-height:1.5;opacity:.92}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:600;font-size:12px;color:var(--muted);min-height:32px}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.rl{overflow:auto;padding:6px}
.ag{display:flex;gap:10px;padding:8px;border-radius:9px;align-items:flex-start;cursor:pointer}
.ag:hover,.ag[aria-expanded="true"]{background:var(--chip)}
.ag .tx{flex:1;min-width:0}
.ag .nm{font-weight:700}
.ag .ds{font-size:12px;line-height:1.35}
.ag .st{margin-top:7px}
.ag .acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.use{padding:8px 10px}
.use .r{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.use .bar{height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.use .bar i{display:block;height:100%;border-radius:9px}

/* activity */
.act{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:300px;padding-bottom:8px}
.log div{display:flex;gap:8px;align-items:center;padding:3px 14px;font-size:12px;white-space:nowrap}
.log .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.log b{font-weight:600}
.log .tx{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.log .new{animation:flash 1.4s}
@keyframes flash{from{background:var(--chip)}}

/* bottom center command */
.cmd{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 700px));display:flex;gap:6px;padding:6px}
.cmd input{flex:1;min-width:0;border:0;background:var(--chip);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);min-height:34px}
.cmd input::placeholder{color:var(--muted)}
.cmd .to{display:flex;align-items:center;gap:6px;padding:0 8px;font-weight:600;font-size:12px;white-space:nowrap}

/* bottom right controls */
.ctl{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:2px;padding:4px}
.ctl button{width:34px;height:34px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.ctl button:hover{background:var(--chip)}
.ctl .sep{width:1px;background:var(--line);margin:6px 4px}

/* 3D overlays */
#ov{position:fixed;inset:0;pointer-events:none}
.ftag{position:absolute;transform:translate(calc(-100% - 6px),-50%);pointer-events:auto;display:flex;align-items:center;gap:7px;border:0;background:rgba(24,27,33,.88);color:#fff;border-radius:8px;padding:5px 9px 5px 5px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:background .2s}
.ftag .n{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700}
.ftag .c{opacity:.7;font-weight:500}
.ftag .w{display:flex;align-items:center;gap:3px;color:#ffc65c}
.ftag[aria-current="true"]{background:#fff;color:#111}
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;padding:0;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.16);display:grid;place-items:center}
.bub.sel{box-shadow:0 0 0 3px var(--done),0 3px 10px rgba(0,0,0,.16)}
.bub.waiting{background:var(--wait);width:auto;height:auto;max-width:230px;border-radius:10px;padding:6px 10px;color:#fff;font-size:12px;font-weight:700;line-height:1.3;text-align:center;animation:bob 1s ease-in-out infinite}
.bub.waiting::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--wait)}
.bub.error{background:var(--err)}
body.live #routinesCard{display:none}
.limits{bottom:calc(env(safe-area-inset-bottom,0px) + 60px);right:max(12px,env(safe-area-inset-right,0px));width:292px;padding:10px 12px 8px}
.lim{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.lim:first-of-type{border-top:0}
.lim .nm{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;grid-column:1/-1}
.lim .nm small{font-weight:500;color:var(--muted);margin-left:auto;font-size:11px}
.lim .w{font-size:11px;color:var(--muted);white-space:nowrap}
.lim .b{height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.lim .b i{display:block;height:100%;border-radius:9px}
.lim.stale{opacity:.55}
.msg.user{align-self:flex-end;background:var(--chip);border:1px dashed var(--line)}
.msg.tool{align-self:flex-start;background:transparent;color:var(--muted);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 4px}
.msg.tool::before{content:"› "}
.msg code{font:12px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.15);padding:0 4px;border-radius:4px}
.msg .lbl{display:block;font-size:10px;opacity:.6;margin-bottom:2px}
.ro{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hire .opts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.hire .opts button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.hire label{display:block;font-weight:600;font-size:12px;margin:8px 0 4px}
.hire select,.hire input,.hire textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px}
.hire textarea{resize:vertical;min-height:70px}
.bub.resting{width:auto;height:24px;padding:0 9px;border-radius:99px}
@keyframes bob{50%{margin-top:-5px}}
.bub b{color:#fff;font-weight:800;font-size:16px}
.bub.resting b{color:#8a909b;font-size:12px;letter-spacing:1px}
.bub .d3{display:flex;gap:3px}.bub .d3 i{width:4px;height:4px;border-radius:50%;background:var(--ok);animation:d3 1.2s infinite}
.bub .d3 i:nth-child(2){animation-delay:.2s}.bub .d3 i:nth-child(3){animation-delay:.4s}
@keyframes d3{50%{opacity:.2}}
.bub.done svg{stroke:var(--done)}
.bub .nmtag{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:rgba(17,19,24,.8);color:#fff;padding:1px 6px;border-radius:5px;white-space:nowrap}

/* chat drawer */
.chat{top:0;right:0;bottom:0;width:330px;border-radius:0;border-width:0 0 0 1px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;z-index:5;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:0}}
.chat header{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.chat header .nm{font-weight:700;font-size:14px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;word-break:break-word;max-width:85%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4;background:var(--chip)}
.msg.me{align-self:flex-end;background:var(--btn);color:var(--btn-ink)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:11px}
.msg time{display:block;font-size:10px;opacity:.6;margin-top:3px}
body.chat-open .tr{display:none}
body.chat-open .ctl{right:342px}
.rh.dh{display:block;background:#16181c}
.dh .who{display:flex;gap:10px;align-items:center}
.dh .ava{width:38px;height:38px;border-radius:10px}
.dh .x{color:#fff}.dh .x:hover{background:rgba(255,255,255,.12)}
.dh .stp{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:99px;font-size:11px;margin-top:12px}
.dh .task{font-weight:700;font-size:14px;margin-top:8px;line-height:1.35}
.dh .role{font-size:11px;opacity:.7;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 10px 6px}
.tile{background:var(--chip);border-radius:8px;padding:8px}
.tile b{font-size:18px;display:block;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted)}
.spark{display:block;padding:0 10px;box-sizing:border-box}
.steps{padding:4px 12px}
.steps div{display:flex;gap:10px;font-size:12px;padding:3px 0}
.dact{display:flex;flex-direction:column;gap:6px;padding:10px}
.dact .btn{min-height:36px}
.rt{display:flex;gap:9px;padding:7px 12px 7px 14px;align-items:flex-start}
.rt .ic{width:20px;height:20px;border-radius:6px;background:var(--chip);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.rt .nm{font-weight:600}
.rt .ds{font-size:11px;line-height:1.35}
.rt .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cd{font-size:11px;font-weight:700;color:#1d4ed8;background:#e0ebff;padding:2px 6px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
body[data-dark="1"] .cd{background:#1b2a4a;color:#9fbcff}
.rt.off{opacity:.6}
.quick{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.chat form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;border:0;background:var(--chip);border-radius:8px;padding:0 10px;font:inherit;color:var(--ink);min-height:34px}

/* connect */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);display:grid;place-items:center;z-index:10;padding:16px}
.modal{position:relative;width:min(440px,100%);padding:18px}
.modal h2{margin:0 0 4px;font-size:17px}
.int{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.int .tx{flex:1}
.int b{display:block}
.int small{color:var(--muted);font-size:12px}
.pill-ok{font-size:11px;font-weight:700;color:#137a3d;background:#dcf5e5;padding:3px 8px;border-radius:99px;white-space:nowrap}
body[data-dark="1"] .pill-ok{background:#163222;color:#7fe0a0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){.cmd{display:none}}
@media (max-width:900px){.left,.act,.right{display:none}.counts{top:calc(env(safe-area-inset-top,0px) + 64px)}}
@media (max-width:560px){.tr .lbl{display:none}.counts span{padding:5px 6px}.counts .t{display:none}.brand .live{display:none}.chat{left:12px;width:auto}}
</style>

<canvas id="scene" tabindex="0" aria-label="3D-здание ИИ-офиса. Тяните, чтобы вращать, нажмите на этаж, чтобы заглянуть внутрь."></canvas>
<div id="ov"></div>

<div class="card brand">
  <div class="logo" aria-hidden="true">И</div>
  <div><b>ИИ-Офис</b><small class="muted">управляет Claude Code</small></div>
  <div class="live muted"><span class="dot"></span><span id="modeLbl">Демо-данные</span> <span id="clock">--:--</span></div>
</div>

<div class="card counts" id="counts" aria-live="polite"></div>

<div class="card tr">
  <button class="btn ghost" id="darkBtn" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl" id="darkLbl">Тёмная</span></button>
  <button class="btn ghost" id="hireBtn" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Нанять</span></button>
  <button class="btn" id="connectBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7zM12 16v5"/></svg><span class="lbl">Подключить ИИ</span></button>
</div>

<div class="card left">
  <section class="card">
    <div class="sec-h"><p class="cap">Этажи <span class="badge" id="floorsN">6</span></p></div>
    <div class="floors" id="floors"></div>
  </section>
  <section class="card" id="waitCard">
    <div class="sec-h"><p class="cap">Ждут меня <span class="badge warn" id="waitN">0</span></p></div>
    <div id="waitList"></div>
  </section>
  <section class="card">
    <div class="sec-h"><p class="cap">Готово <span class="badge" id="finN">0</span></p><button class="chev" id="finToggle" aria-expanded="true" aria-label="Свернуть"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7.5l3-3 3 3"/></svg></button></div>
    <div id="finList" style="padding-bottom:6px"></div>
  </section>
  <section class="card" id="routinesCard">
    <div class="sec-h"><p class="cap">Рутины <span class="badge">4</span></p></div>
    <div id="routines" style="padding-bottom:6px"></div>
  </section>
</div>

<div class="card right" id="right">
  <div class="rh" id="rh"></div>
  <div class="tabs" role="tablist"><button role="tab" id="tTeam" aria-selected="true">Команда</button><button role="tab" id="tUse" aria-selected="false">Расход</button></div>
  <div class="rl" id="rl"></div>
</div>

<div class="card act">
  <div class="sec-h"><p class="cap">Активность</p></div>

  return `<div class="int" style="display:block"><b>Промпт для Grok Bot</b><small class="muted" style="display:block;margin:2px 0 6px">Вставь его боту-менеджеру в Grok Bot. Ссылку на канал никому не показывай: кто её знает, может писать в офис статусы.</small>
    <label class="sr" for="grokPrompt">Промпт для Grok Bot</label><textarea id="grokPrompt" readonly rows="7" style="width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--chip);color:var(--ink);resize:vertical">${esc(grokPrompt(nt.url))}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn" data-copyprompt="1">Скопировать</button><button class="btn ghost" data-ntfy="new">Новый канал</button><button class="btn ghost" data-ntfy="off">Отключить</button></div></div>`;
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Office': '1' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function liveDecide(a, decision) {
  if (!a.approval) { log('Офис', 'ответь ' + a.name + ' в терминале или Vibe Island', 'waiting'); renderUI(); return; }
  api('/api/decide', { id: a.approval, decision }).catch(e => { log('Офис', e.message, 'error'); renderUI(); });
}
function applyHub(st) {
  S.hub = st;
  const projs = st.projects.length ? st.projects : [{ name: 'Холл', color: '#9aa1ad' }];
  const prev = new Map(ALL().map(a => [a.id, a]));
  const floors = projs.slice().reverse().map(p => ({ name: p.name, color: p.color, agents: [] }));   // newest project on top
  st.agents.forEach(h => {
    const fi = floors.findIndex(f => f.name === h.project); if (fi < 0) return;
    const a = prev.get(h.id) || { id: h.id, seatKind: null, use: 0 };
    a.prevStatus = a.status;
    Object.assign(a, { name: h.name, kind: KIND[h.kind] ? h.kind : 'claude', status: h.status, task: h.task, since: h.since * 1000, steps: h.steps, tasks: h.tasks,
      events: h.events, hist: h.hist && h.hist.length > 1 ? h.hist : [0, 0], role: h.where, approval: h.approval, fi });
    floors[fi].agents.push(a);
  });
  LOG.length = 0; (st.log || []).forEach(l => LOG.push(l));
  const sig = (fl) => fl.map(f => f.name + ':' + f.agents.map(a => a.id).join(',')).join('|');
  if (!LEVELS.length || sig(floors) !== sig(FLOORS)) { FLOORS = floors; rebuild(); }
  else {
    floors.forEach((f, i) => { const old = FLOORS[i]; f.n = old.n; f.L = old.L; f.L.f = f; });
    FLOORS = floors;
    ALL().forEach(a => { if (a.prevStatus !== a.status) place(a); });
  }
  if (S.sel && !byId(S.sel)) S.sel = null;
}
function connectStream() {
  const es = new EventSource('/api/stream');
  es.onmessage = (m) => { try { applyHub(JSON.parse(m.data)); renderUI(); } catch (e) { console.error(e); } };
  es.onopen = () => { $('modeLbl').textContent = 'Live'; };
  es.onerror = () => { $('modeLbl').textContent = 'Нет связи с хабом'; };
}
async function boot() {
  try {
    if (location.protocol === 'file:' || /claude\.(ai|com)$/.test(location.hostname)) throw new Error('demo');
    const st = await api('/api/state'); if (!st || !Array.isArray(st.agents)) throw new Error('no hub');
    S.live = true; document.body.classList.add('live'); FLOORS = []; applyHub(st); connectStream();
  } catch (e) { S.live = false; rebuild(); }
}
resize(); boot().then(() => { applyDark(); requestAnimationFrame(frame); });
})();
</script>
